<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Predictions EV - Rax Academy</title>
<meta name="robots" content="noindex">
<style>
  :root{--bg:#141925;--panel:#1d2433;--panel2:#242c3d;--line:#2c3549;--ink:#e9e7e1;--mute:#9aa3b5;--accent:#E8A33D;--good:#3fbf7f;--bad:#e5534b;--live:#ff4d5e}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  .wrap{max-width:780px;margin:0 auto;padding:16px 16px 48px}
  a{color:var(--accent)}
  .back{display:inline-block;color:var(--mute);text-decoration:none;font-weight:700;font-size:14px;margin:2px 0 6px}
  h1{font-size:26px;margin:4px 0 2px} .note{color:var(--mute);font-size:13px}
  .top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
  .pulse{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mute);font-weight:700}
  .pulse i{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 0 rgba(63,191,127,.6);animation:p 2s infinite}
  .pulse.stale i{background:var(--bad);animation:none}
  @keyframes p{70%{box-shadow:0 0 0 7px rgba(63,191,127,0)}100%{box-shadow:0 0 0 0 rgba(63,191,127,0)}}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0 4px}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chips button,.tog{background:var(--panel);color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
  .chips button[aria-pressed="true"],.tog[aria-pressed="true"]{color:var(--ink);border-color:var(--accent);background:var(--panel2)}
  .sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
  .sum div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .sum b{display:block;font-size:20px} .sum span{font-size:12px;color:var(--mute)}
  .g{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin:10px 0;overflow:hidden}
  .g.hot{border-color:rgba(63,191,127,.55)}
  .gh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px 8px}
  .gh .nm{font-size:16px;font-weight:800;color:var(--ink);text-decoration:none}
  .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:3px}
  .tag{font-size:11px;font-weight:800;letter-spacing:.03em;padding:2px 7px;border-radius:999px;background:var(--panel2);color:var(--mute)}
  .tag.live{background:rgba(255,77,94,.15);color:var(--live)} .tag.lock{color:var(--accent)}
  .go{flex:none;background:var(--accent);color:#1a1205;text-decoration:none;font-weight:900;font-size:13px;padding:7px 12px;border-radius:10px;white-space:nowrap}
  .sd{display:grid;grid-template-columns:1fr 64px 64px 78px;gap:8px;align-items:center;padding:9px 14px;border-top:1px solid var(--line)}
  .sd .t{font-weight:800;display:flex;align-items:center;gap:8px;min-width:0} .sd .t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ref{display:block;font-size:11px;font-weight:600;color:var(--mute)}
  .dot{width:10px;height:10px;border-radius:3px;flex:none;border:1px solid rgba(255,255,255,.2)}
  .sd .c{text-align:right;font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em} .sd .c b{display:block;color:var(--ink);font-size:15px;text-transform:none;letter-spacing:0}
  .ev{text-align:right;font-weight:900;font-size:17px} .ev small{display:block;font-size:10px;color:var(--mute);font-weight:700;letter-spacing:.04em}
  .pos{color:var(--good)} .neg{color:var(--bad)} .nil{color:var(--mute)}
  .ft{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 14px 10px;border-top:1px solid var(--line);background:rgba(0,0,0,.12)}
  .srcs{font-size:12px;color:var(--mute)} .srcs b{color:var(--ink);font-weight:700}
  .src{font-size:12px;flex:none;color:var(--mute);display:inline-flex;align-items:center;gap:6px} .src b{color:var(--ink);font-weight:700}
  svg.sp{flex:none;vertical-align:middle}
  .bd{border-top:1px solid var(--line);padding:8px 14px 10px}
  .bd summary{cursor:pointer;color:var(--accent);font-weight:700;font-size:13px}
  .bkr{display:grid;gap:8px;align-items:center;padding:5px 0;border-top:1px solid var(--line);font-size:13px}
  .bkr span:not(:first-child){text-align:right;font-weight:700} .bkr small{display:block;font-size:10px;color:var(--mute);font-weight:600}
  .bkr em{font-style:normal;font-size:11px;color:var(--accent)} .bkr .ag{color:var(--mute);font-weight:600}
  .bkh{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);border-top:0;margin-top:6px} .bkh span{font-weight:800!important}
  .bkr.old{opacity:.55} .bkr.tot{background:rgba(232,163,61,.06)} .bkr.ref2{color:var(--mute)}
  .empty{padding:20px;text-align:center;color:var(--mute);background:var(--panel);border:1px solid var(--line);border-radius:14px}
  @media(max-width:520px){.sd{grid-template-columns:1fr 52px 52px 66px;gap:6px}.sum b{font-size:17px}.gh{align-items:flex-start}}
</style>
</head>
<body><div class="wrap">
<a href="/" class="back">← Home</a>
<div class="top"><div><h1>Predictions EV</h1><p class="note">Real's game markets against sportsbook odds with the margin taken out. EV is what 1 rax returns on average.</p></div>
<span class="pulse" id="pulse"><i></i><span id="ago">-</span></span></div>
<div class="sum" id="sum"></div>
<div class="bar"><div class="chips" id="chips"></div><button class="tog" id="plus" aria-pressed="false">+EV only</button></div>
<div id="list"></div>
<p class="note" id="foot"></p>
</div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ls = { get: k => { try{ return localStorage.getItem(k); }catch(e){ return null; } }, set: (k, v) => { try{ localStorage.setItem(k, v); }catch(e){} } };
const pc = v => v == null ? '-' : (Math.round(v * 1000) / 10).toFixed(1) + '%';
const SPN = { nhl: 'NHL', nba: 'NBA', nfl: 'NFL', ncaaf: 'CFB', ufc: 'UFC', soccer: 'FC' };
let J = null, chip = ls.get('pred_chip') || '', plus = ls.get('pred_plus') === '1';
/* Thin odds: a live game priced from fewer than 3 books, or whose newest line is over 60 s old.
   Its EV is greyed out and kept out of the counts at the top. */
const bkOf = g => (g.sources || []).flatMap(x => x.bk || []);
const thin = g => { const b = bkOf(g); if (!b.length) return true; if (!g.live) return b.length < 2; const newest = Math.max(...b.map(x => x.u || 0)); return b.length < 3 || Date.now() - newest > 60000; };
const best = g => thin(g) ? -9 : Math.max(...g.sides.map(s => s.ev ?? -9));
const rawBest = g => Math.max(...g.sides.map(s => s.ev ?? -9));
function spark(h){
  if(!h || h.length < 2) return '';
  const w = 70, ht = 22, mn = Math.min(...h), mx = Math.max(...h), r = mx - mn || 0.01;
  const pts = h.map((v, i) => `${(i / (h.length - 1) * w).toFixed(1)},${(ht - 2 - (v - mn) / r * (ht - 4)).toFixed(1)}`).join(' ');
  const up = h[h.length - 1] >= h[0];
  return `<svg class="sp" width="${w}" height="${ht}" viewBox="0 0 ${w} ${ht}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${up ? 'var(--good)' : 'var(--bad)'}" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
}
const amer = d => d == null ? '' : d >= 2 ? '+' + Math.round((d - 1) * 100) : '-' + Math.round(100 / (d - 1));
const age = u => { if(!u) return ''; const s = Math.max(0, Math.round((Date.now() - u) / 1000)); return s < 90 ? s + 's' : Math.round(s / 60) + 'm'; };
const openBd = new Set();
function breakdown(g){
  const bks = (g.sources || []).flatMap(x => x.bk || []);
  if(!bks.length && !(g.refs || []).length) return '';
  const head = `<div class="bkr bkh"><span>Book</span>${g.sides.map(s => `<span>${esc(s.label)}</span>`).join('')}<span>Age</span></div>`;
  const row = (t, p, d, extra, cls) => `<div class="bkr${cls ? ' ' + cls : ''}" style="grid-template-columns:1fr repeat(${g.sides.length},minmax(56px,auto)) 44px"><span>${t}</span>${p.map((v, i) => `<span>${pc(v)}${d && d[i] ? `<small>${amer(d[i])}</small>` : ''}</span>`).join('')}<span class="ag">${extra}</span></div>`;
  const sorted = bks.slice().sort((a, b) => b.w - a.w || a.t.localeCompare(b.t));
  const hd = head.replace('class="bkr bkh"', `class="bkr bkh" style="grid-template-columns:1fr repeat(${g.sides.length},minmax(56px,auto)) 44px"`);
  return `<details class="bd" data-bd="${g.id}"${openBd.has(String(g.id)) ? ' open' : ''}><summary>Book breakdown (${bks.length})</summary>${hd}
    ${sorted.map(b => row(`${esc(b.t)}${b.w !== 1 ? ` <em>×${b.w}</em>` : ''}`, b.p, b.d, age(b.u), age(b.u) && (Date.now() - b.u) > 120000 ? 'old' : '')).join('')}
    ${row('<b>Fair (average)</b>', g.sides.map(s => s.fair), null, '', 'tot')}
    ${row('<b>Real</b>', g.sides.map(s => s.price), null, '', 'tot')}
    ${(g.refs || []).map(r => row(`${esc(r.src)} <em>ref</em>`, r.p, null, '', 'ref2')).join('')}
    <p class="note" style="margin:6px 0 0">% is each book's chance with its margin taken out; small number is its American odds. Age is how long since that book last moved the line. Books older than 2 min (live) or 90 min (pregame) are already left out.</p></details>`;
}
function when(g){
  if(g.live) return '<span class="tag live">● LIVE</span>';
  if(!g.start) return '';
  const d = new Date(g.start);
  return `<span class="tag">${esc(d.toLocaleString([], { weekday: 'short', hour: 'numeric', minute: '2-digit' }))}</span>`;
}
async function load(){
  try{ const t = ls.get('ratebrd_token_v1') || ''; J = await (await fetch('/api/swaps?op=predev', { headers: t ? { 'x-rb-token': t } : {} })).json(); }catch(e){ J = { error: 'Could not reach the site.' }; }
  if(J.error){ $('#list').innerHTML = `<div class="empty">${/sign in/i.test(J.error) ? 'Sign in first - <a href="/?next=/predictions">sign in</a>.' : esc(J.error)}</div>`; return; }
  if(!J.keySet){ $('#list').innerHTML = '<div class="empty">The Odds API key isn\'t on the server yet.</div>'; return; }
  draw();
}
function tick(){
  if(!J || !J.at) return;
  const s = Math.max(0, Math.round((Date.now() - J.at) / 1000));
  $('#ago').textContent = s < 60 ? `Updated ${s}s ago` : `Updated ${Math.round(s / 60)} min ago`;
  $('#pulse').classList.toggle('stale', s > 60);
}
function draw(){
  const games = J.games || [];
  const sps = [...new Set(games.map(g => g.sport))];
  $('#chips').innerHTML = sps.length > 1 ? ['', ...sps].map(s => `<button data-c="${s}" aria-pressed="${chip === s}">${s ? SPN[s] || s : 'All'}</button>`).join('') : '';
  $('#plus').setAttribute('aria-pressed', plus);
  const pos = games.filter(g => best(g) > 0), top = games.reduce((a, g) => Math.max(a, best(g)), -9);
  $('#sum').innerHTML = `<div><b>${games.length}</b><span>open markets</span></div><div><b class="pos">${pos.length}</b><span>with a +EV side</span></div><div><b class="${top > 0 ? 'pos' : 'nil'}">${top > -9 ? (top > 0 ? '+' : '') + pc(top) : '-'}</b><span>best edge</span></div>`;
  const l = games.filter(g => (!chip || g.sport === chip) && (!plus || best(g) > 0)).sort((a, b) => (b.live - a.live) || (best(b) - best(a)) || (rawBest(b) - rawBest(a)));
  $('#list').innerHTML = l.map(g => {
    const srcs = g.sources || [];
    return `<div class="g${best(g) > 0.02 ? ' hot' : ''}">
    <div class="gh"><div style="min-width:0">
      ${g.path ? `<a class="nm" href="https://www.realapp.com${esc(g.path)}" target="_blank" rel="noopener">${esc(g.game)}</a>` : `<span class="nm">${esc(g.game)}</span>`}
      <div class="meta"><span class="tag">${esc(SPN[g.sport] || g.sport)}</span>${when(g)}${g.locked ? '<span class="tag lock">Locked</span>' : ''}${thin(g) && bkOf(g).length ? '<span class="tag lock" title="Too few books or lines too old to trust the EV">Thin odds</span>' : ''}${g.volume ? `<span class="tag">${esc(g.volume)} vol</span>` : ''}</div></div>
      ${g.link ? `<a class="go" href="${esc(g.link)}" target="_blank" rel="noopener">Predict ↗</a>` : ''}</div>
    ${g.sides.map((s, si) => `<div class="sd"><span class="t"><i class="dot" style="background:${esc(s.color || '#555')}"></i><span>${esc(s.label)}${(g.refs || []).length ? `<small class="ref">${g.refs.map(r => `${esc(r.src)} ${pc(r.p[si])}`).join(' · ')}</small>` : ''}</span></span>
      <span class="c">Real<b>${pc(s.price)}</b></span><span class="c">Fair<b>${pc(s.fair)}</b></span>
      <span class="ev ${s.ev == null || thin(g) ? 'nil' : s.ev > 0 ? 'pos' : 'neg'}">${s.ev == null ? '-' : (s.ev > 0 ? '+' : '') + pc(s.ev)}<small>EV</small></span></div>`).join('')}
    <div class="ft"><span class="srcs">${srcs.length ? 'Fair from <b>' + srcs.map(x => x.books ? `<span title="${esc(x.books.join(', '))}">${esc(x.src)}</span>` : esc(x.src)).join('</b>, <b>') + '</b>' : 'No sportsbook odds found for this game yet'}</span>${(() => { const h = g.hist || []; if (h.length < 2) return ''; const v = h[h.length - 1], sd = g.sides.reduce((a, x) => Math.abs((x.price ?? 9) - v) < Math.abs((a.price ?? 9) - v) ? x : a, g.sides[0]); return `<span class="src" title="Real's price for ${esc(sd.label)}, last few hours">${esc(sd.label)} ${spark(h)}</span>`; })()}</div>${breakdown(g)}</div>`;
  }).join('') || `<div class="empty">${plus ? 'No +EV sides right now.' : 'No open game markets on Real right now.'}</div>`;
  $('#foot').textContent = `Real's prices refresh every 10 s. Sportsbook odds: every 5 min, every minute in the 2 hours before a game, every 40 s while it's live. Fair price: the equal-weight average of DraftKings, FanDuel, BetMGM, Caesars, Fanatics, theScore Bet, BetRivers, BetOnline, Novig, Pinnacle and Kalshi, margins removed, stale lines dropped. Polymarket shown for comparison only.${J.credits != null ? ` ${Number(J.credits).toLocaleString()} odds credits left.` : ''}`;
  tick();
}
document.addEventListener('toggle', e => { const d = e.target; if(!d.matches || !d.matches('details.bd')) return; d.open ? openBd.add(d.dataset.bd) : openBd.delete(d.dataset.bd); }, true);
$('#chips').addEventListener('click', e => { const b = e.target.closest('[data-c]'); if(!b) return; chip = b.dataset.c; ls.set('pred_chip', chip); draw(); });
$('#plus').addEventListener('click', () => { plus = !plus; ls.set('pred_plus', plus ? '1' : '0'); draw(); });
load(); setInterval(load, 10000); setInterval(tick, 1000);
</script>
</body>
</html>
