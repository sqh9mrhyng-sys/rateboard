<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Report a user - Rax Academy</title>
<style>
  :root{--bg:#141925;--panel:#1d2433;--panel2:#262f42;--line:#2c3549;--ink:#e9e7e1;--mute:#9aa3b5;--accent:#E8A33D;--good:#3fbf7f;--bad:#e5534b}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  .wrap{max-width:560px;margin:0 auto;padding:16px 16px 48px}
  .back{display:inline-block;color:var(--mute);text-decoration:none;font-weight:700;font-size:14px;margin:2px 0 10px}
  h1{font-size:26px;margin:4px 0 4px} .lead{color:var(--mute);margin:0 0 18px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}
  label{display:block;font-size:13px;font-weight:700;color:var(--mute);margin:0 0 6px}
  .f{margin-bottom:16px}
  input,select,textarea{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font:inherit;font-size:16px}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
  textarea{min-height:130px;resize:vertical}
  .go{width:100%;background:var(--accent);color:#1a1205;border:0;border-radius:12px;padding:14px;font:inherit;font-size:16px;font-weight:900;cursor:pointer} .go:disabled{opacity:.6}
  .msg{margin:12px 0 0;font-size:14px;color:var(--mute)} .msg.ok{color:var(--good)} .msg.bad{color:var(--bad)}
  .note{color:var(--mute);font-size:13px}
  .done{text-align:center;padding:24px 8px} .done b{display:block;font-size:20px;margin-bottom:6px}
  .kinds{display:grid;grid-template-columns:1fr 1fr;gap:8px} .kinds button{background:var(--panel2);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:12px 8px;font:inherit;font-weight:700;font-size:14px;cursor:pointer;text-align:left}
  .kinds button small{display:block;color:var(--mute);font-weight:500;font-size:12px} .kinds button[aria-pressed="true"]{border-color:var(--accent)}
</style>
<script src="/theme.js"></script>
</head>
<body><div class="wrap">
<a href="/" class="back">← Home</a>
<h1>Report a user</h1>
<p class="lead">Scammed, fake screenshots, didn't send? Tell me who and what happened. Reports go to the admin only - nothing is shared with the person you report.</p>
<form class="card" id="f">
  <div class="f"><label for="who">Their Real username</label><input id="who" placeholder="e.g. somebody123" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="60" required></div>
  <div class="f"><label for="why">What happened</label><textarea id="why" maxlength="1000" placeholder="What you agreed, what they did, when. Links to screenshots or comments help." required></textarea></div>
  <button class="go" id="go">Send report</button>
  <p class="msg" id="msg"></p>
</form>
</div>
<script>
const $ = s => document.querySelector(s);
const tok = () => { try { return localStorage.getItem('ratebrd_token_v1') || ''; } catch (e) { return ''; } };
if (!tok()) location.href = '/?next=' + encodeURIComponent(location.pathname);
async function send(body){ const r = await fetch('/api/kv', { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-rb-token': tok() }, body: JSON.stringify(body) }); const j = await r.json().catch(() => ({})); if (r.status === 401) { location.href = '/?next=' + encodeURIComponent(location.pathname); return null; } return r.ok ? j : { error: j.error || 'Could not send. Try again.' }; }
const p = new URLSearchParams(location.search).get('u'); if (p) $('#who').value = p;
$('#f').addEventListener('submit', async e => { e.preventDefault();
  const target = $('#who').value.trim().replace(/^@/, ''), reason = $('#why').value.trim();
  if (target.length < 2 || reason.length < 3) { $('#msg').className = 'msg bad'; $('#msg').textContent = 'Add a username and what happened.'; return; }
  $('#go').disabled = true; $('#msg').className = 'msg'; $('#msg').textContent = 'Sending…';
  const j = await send({ op: 'userReport', target, reason }); if (!j) return;
  if (j.error) { $('#go').disabled = false; $('#msg').className = 'msg bad'; $('#msg').textContent = j.error; return; }
  $('#f').innerHTML = '<div class="done"><b>Report sent</b><span class="note">Thanks - I\'ll look into it. You\'ll see any update under Notifications.</span><p><a href="/" style="color:var(--accent)">Back to Home</a></p></div>'; });
</script>
</body>
</html>
