<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Giveaway list - Rax Academy</title>
<!-- Giveaway list (Dennis, 2026-11-26): members of group 60099 the bot has a chat with, and when each was messaged. Dennis only. -->
<style>
  :root{--bg:#141925;--panel:#1d2433;--panel2:#232b3d;--line:#2c3549;--ink:#e9e7e1;--mute:#9aa3b5;--accent:#E8A33D;--ok:#5fbf7a;--bad:#e5484d}
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  [hidden]{display:none!important}
  button,input{font:inherit;color:inherit}
  button{cursor:pointer;-webkit-tap-highlight-color:transparent}
  .wrap{max-width:640px;margin:0 auto;padding:14px 16px calc(40px + env(safe-area-inset-bottom))}
  h1{font-size:24px;line-height:1.1;margin:6px 0 4px;font-weight:800;letter-spacing:-.02em}
  .lead{color:var(--mute);font-size:13.5px;margin:0 0 16px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;margin-bottom:14px}
  .ph{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 10px}
  .ph h2{font-size:17px;margin:0;font-weight:800}
  .ph a{color:var(--accent);font-size:13px;font-weight:700;text-decoration:none}
  .ph small{color:var(--mute);font-size:12.5px}
  .add{position:relative;padding:0 16px 12px}
  .add input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:16px}
  .add input:focus{outline:none;border-color:var(--accent)}
  .sug{position:absolute;left:16px;right:16px;top:calc(100% - 8px);z-index:5;background:var(--panel2);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.4)}
  .sug button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:11px 12px;font-weight:700}
  .sug button:first-child{border-top:0}
  .sug button span{color:var(--mute);font-weight:600;font-size:13px}
  .sug .none{padding:11px 12px;color:var(--mute);font-size:13.5px}
  .u{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding:11px 12px 11px 16px}
  .u b{font-weight:700}
  .u span{color:var(--mute);font-size:12.5px;margin-left:6px}
  .u button{border:1px solid var(--line);background:var(--panel2);color:var(--bad);border-radius:9px;padding:6px 12px;font-weight:800;font-size:13px}
  .empty{border-top:1px solid var(--line);padding:14px 16px;color:var(--mute);font-size:13.5px}
  .msg{text-align:center;color:var(--mute);padding:40px 10px}
  .toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);font-weight:800;border-radius:99px;padding:10px 18px;z-index:99}
  table{width:100%;border-collapse:collapse;font-size:14px} td,th{padding:8px 10px;border-top:1px solid var(--line);text-align:left} th{color:var(--mute);font-size:12.5px;border-top:0}
  .stat{display:flex;gap:16px;flex-wrap:wrap;padding:12px 16px;color:var(--mute);font-size:13.5px} .stat b{color:var(--ink);font-size:18px;display:block}
  .bar{display:flex;gap:8px;padding:0 16px 12px} .bar button{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:8px 12px;font-weight:700}
  .ok{color:var(--ok)} .mute{color:var(--mute)}
</style>
<script src="/theme.js"></script>
<script src="/nav.js?v=9"></script>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/img/favicon-48.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rax Academy">
<meta name="theme-color" content="#141925">
</head>
<body>
<div class="wrap">
  <h1>Giveaway list</h1>
  <p class="lead">Members of the group the bot has a chat with. Everyone here gets the giveaway message once, in quiet gaps between swap DMs.</p>
  <div class="card"><div class="stat" id="stat">Loading…</div><div class="bar"><button type="button" id="copy">Copy usernames</button><button type="button" id="reload">Refresh</button></div>
  <div id="list"></div></div>
</div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const tok = () => { try { return localStorage.getItem('ratebrd_token_v1') || ''; } catch (e) { return ''; } };
const ak = t => t ? new Date(t).toLocaleString('en-US', { timeZone: 'America/Anchorage', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : '';
let ROWS = [];
async function load() {
  let j = {}; try { const r = await fetch('/api/swaps?op=grpdm', { headers: { 'x-rb-token': tok() } }); j = await r.json().catch(() => ({})); if (!r.ok && !j.error) j.error = 'Error ' + r.status; } catch (e) { j = { error: 'Could not reach the site.' }; }
  if (j.error) { if (/only dennis|sign in/i.test(j.error)) { location.replace('/'); return; } $('#stat').textContent = j.error; return; }
  ROWS = j.rows || []; const s = j.status || {}, sent = ROWS.filter(r => r.sentAt).length;
  $('#stat').innerHTML = `<span><b>${ROWS.length}</b>in the group</span><span><b>${sent}</b>messaged</span><span><b>${ROWS.length - sent}</b>waiting</span><span><b>${s.toLook ?? 0}</b>chats left to check</span>`;
  $('#list').innerHTML = ROWS.length ? `<table><thead><tr><th>#</th><th>Member</th><th>Messaged (AK)</th></tr></thead><tbody>${ROWS.map((r, i) => `<tr><td class="mute">${i + 1}</td><td>${esc(r.userName)}</td><td>${r.sentAt ? '<span class="ok">' + ak(r.sentAt) + '</span>' : '<span class="mute">waiting</span>'}</td></tr>`).join('')}</tbody></table>` : '<div class="stat">No one yet.</div>';
}
$('#copy').onclick = async () => { try { await navigator.clipboard.writeText(ROWS.map(r => r.userName).join('\n')); $('#copy').textContent = 'Copied ' + ROWS.length; } catch (e) { $('#copy').textContent = 'Copy failed'; } setTimeout(() => $('#copy').textContent = 'Copy usernames', 2000); };
$('#reload').onclick = load;
load();
</script>
</body>
</html>
