<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rax Academy</title>
<style>
  :root{--bg:#141925;--panel:#1d2433;--panel2:#232b3d;--line:#2c3549;--ink:#e9e7e1;--mute:#9aa3b5;--accent:#E8A33D;--ok:#5fbf7a;--bad:#e5484d}
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(700px 320px at 50% -80px, rgba(232,163,61,.16), transparent 70%),var(--bg);background-repeat:no-repeat;color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
  .wrap{max-width:980px;margin:0 auto;padding:16px}
  a{color:var(--accent)}
  .note{color:var(--mute);font-size:13px}
  button{font:inherit;cursor:pointer;color:var(--ink)}
  .hide{display:none!important}

  /* Row 1: the one dropdown. */
  .top{display:flex;justify-content:center;margin:4px 0 12px}
  .navbtn{display:inline-flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 18px;font-weight:800;font-size:17px}
  .navbtn .caret{color:var(--mute);font-size:12px}
  .menu{position:absolute;z-index:20;min-width:230px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 12px 32px rgba(0,0,0,.45)}
  .menu a,.menu button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:10px 12px;color:var(--ink);text-decoration:none;font-size:15px}
  .menu a:hover,.menu button:hover{background:var(--panel2)}
  .menu .cur{color:var(--accent);font-weight:800}
  .menu .sep{height:1px;background:var(--line);margin:6px 4px}
  .menu .dot{width:7px;height:7px;border-radius:50%;background:var(--line);flex:none}
  .menu .cur .dot{background:var(--accent)}

  /* Row 2: the account bar. */
  .acct{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:16px}
  .acct .who{font-size:13px;color:var(--mute);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .acct .who b{color:var(--ink);font-size:14px}
  .acct .mid{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:7px 12px;font-size:13.5px;font-weight:700}
  .acct .out{justify-self:end;background:none;border:0;color:var(--mute);font-size:13.5px;text-decoration:underline;padding:6px 0}
  .acctmenu .me{color:var(--accent);font-weight:800}
  .acctmenu .tag{margin-left:auto;font-size:11px;color:var(--mute);font-weight:600}
  .acctmenu .add{color:var(--accent);font-weight:700}

  /* The page body - a first pass to adjust from. */
  h1{font-size:24px;margin:2px 0 12px;font-weight:800;text-align:center}
  h1 a{color:var(--ink);text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:3px;text-underline-offset:6px}
  h1 a:hover{color:var(--accent)}
  .acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .act{display:flex;align-items:center;justify-content:center;text-align:center;min-height:52px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 6px;color:var(--ink);text-decoration:none;font-weight:700;font-size:13.5px;line-height:1.25}
  .act:hover{border-color:var(--c)}
  .act{--c:var(--accent);background:color-mix(in srgb,var(--c) 13%,var(--panel2));border-color:color-mix(in srgb,var(--c) 40%,var(--line))}
  /* One blue for all three (Dennis, 2026-11-10), matching the navy tiles. */
  .act.c1,.act.c2,.act.c3{--c:#3d6fd6;background:linear-gradient(180deg,#1f2d4d,#18233d);border-color:#2f4878;box-shadow:0 8px 20px -14px rgba(61,111,214,.9)}
  .act.c1:hover,.act.c2:hover,.act.c3:hover{border-color:#5b8cff}
  .tiles{display:grid;grid-template-columns:1fr;gap:10px;margin-top:16px}
  /* Each box: the link, and grip lines on the right that drag it up or down. */
  /* Every tile one navy that lights up (Dennis, 2026-11-09): a soft blue glow from the bottom edge, brighter when touched. */
  .tile{--c:#3d6fd6;display:flex;align-items:stretch;background:radial-gradient(120% 95% at 50% 118%,rgba(61,111,214,.28),transparent 60%),linear-gradient(180deg,#1a2338,#141c2e);border:1px solid #3d6fd6;border-radius:12px;transition:border-color .15s,background .15s}
  .tile:hover,.tile:active,.tile:focus-within{border-color:#6f9bff;background:radial-gradient(120% 95% at 50% 118%,rgba(91,140,255,.42),transparent 62%),linear-gradient(180deg,#1c2740,#152036)}
  .tile .tl{flex:1;min-width:0;padding:14px 0 14px 46px;color:var(--ink);text-decoration:none;text-align:center}
  .tile .grip{flex:none;width:46px;display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none;color:var(--mute)}
  .tile .grip i{display:block;width:18px;height:2px;background:currentColor;border-radius:2px;box-shadow:0 -6px 0 currentColor,0 6px 0 currentColor}
  .tile .grip:hover{color:var(--accent)}
  .tile.drag{position:relative;z-index:5;border-color:var(--accent);box-shadow:0 10px 28px rgba(0,0,0,.5);cursor:grabbing}
  .tiles.dragging .tile:not(.drag){transition:transform .12s}
  body.dragging{user-select:none;-webkit-user-select:none}
  .tl b{display:block;font-size:18px;font-weight:800;margin-bottom:3px}
  .tl span{color:var(--mute);font-size:13px}
  .hsign{display:flex;flex-direction:column;gap:10px;text-align:left}
  .hsign input{font:inherit;font-size:16px;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--ink)}
  .hsign button{font:inherit;font-weight:800;font-size:16px;padding:12px;border-radius:10px;border:0;background:var(--accent);color:#141925;cursor:pointer}
  .hsign button:disabled{opacity:.6}
  .lock{max-width:460px;margin:14vh auto;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
  .acct .who .lbl{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
</style>
</head>
<body>
<div class="wrap">
  <section class="lock" id="lock"><p id="lockmsg">Checking your sign-in…</p>
    <!-- Sign in right here (member suggestion, 2026-11-11), instead of going to the board first. -->
    <form id="hsign" class="hsign" hidden autocomplete="on">
      <h2 style="margin:0 0 4px">Rax Academy</h2>
      <p class="note" style="margin:0 0 12px">Sign in with your board account.</p>
      <input id="hs-u" placeholder="Your Real username" autocomplete="username" autocapitalize="off" spellcheck="false">
      <input id="hs-p" type="password" placeholder="Board password" autocomplete="current-password">
      <button type="submit" id="hs-go">Sign in</button>
      <p class="note" id="hs-msg" style="margin:8px 0 0"></p>
      <p class="note" style="margin:10px 0 0">New here, or forgot your password? <a href="/board">Use the board's sign-in</a>.</p>
    </form></section>

  <div id="page" class="hide">
    <!-- Row 2: active account · all accounts · sign out. -->
    <div class="acct">
      <div class="who"><span class="lbl">Active account</span><b id="me"></b></div>
      <button class="mid" id="acctbtn" aria-haspopup="menu" aria-expanded="false">Accounts &#9662;</button>
      <button class="out" id="signout">Sign out</button>
    </div>

    <h1><a href="https://www.realapp.com/ngWcxFRF4E8" target="_blank" rel="noopener">Rax Academy</a></h1>
    <div class="acts">
      <a class="act c1" href="/username">Change connected account</a>
      <a class="act c2" href="/board#report">Report a user</a>
      <a class="act c3" href="/board#feature">Request a feature</a>
    </div>
    <div class="tiles" id="tiles"></div>
  </div>
</div>
<div class="menu acctmenu hide" id="acctmenu" role="menu"></div>

<script>
/* Home (Dennis, 2026-11-09): the new front page, open to everyone signed in. Row 1 is one dropdown to every page; row 2 is the account bar - the
   active account, every account signed in on this browser (tap to switch, or
   add one), and Sign out. It uses the same saved accounts as the board. */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TOKEN = 'ratebrd_token_v1', DEVICE = 'ratebrd_device_v1', SESSION = 'ratebrd_session', ACCTS = 'ratebrd_accounts_v1';
const ls = { get: k => { try{ return localStorage.getItem(k); }catch(e){ return null; } }, set: (k, v) => { try{ v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); }catch(e){} } };
const getToken = () => ls.get(TOKEN) || '';
const loadDevice = () => { try{ const d = JSON.parse(ls.get(DEVICE) || 'null'); if(d && d.key) return d; }catch(e){} const s = ls.get(SESSION); return s ? { key: s, name: s } : null; };
const loadAccts = () => { try{ const a = JSON.parse(ls.get(ACCTS) || '[]'); return Array.isArray(a) ? a.filter(x => x && x.key && x.token) : []; }catch(e){ return []; } };
const saveAccts = a => ls.set(ACCTS, JSON.stringify(a.slice(0, 8)));
const api = async (u, o = {}) => { try{ const t = getToken(); const r = await fetch(u, Object.assign({}, o, { headers: Object.assign({}, o.headers || {}, t ? { 'x-rb-token': t } : {}) }));
  const j = await r.json().catch(() => ({})); if(!r.ok && !j.error) j.error = 'Error ' + r.status; return j; }catch(e){ return { error: 'Could not reach the board.' }; } };

// Every page on the site. Board and game data live on the board page.
const PAGES = [
  ['/', 'Home', 'This page'],
  ['/board', 'Board', 'Buy offers for Real cards - post, browse and sell'],
  ['/board#gamedata', 'Game data', 'Every game log, rax and box score', 'admin'],
  ['/packs', 'Pack data', 'Pack odds and packs to each rarity, for every player'],   // everyone (2026-11-09)
  ['/market', 'Market data', 'Recent sales and prices', 'market'],
  ['/swaps', 'Swaps', 'Trade passes with other members, matched every hour'],
  ['/boosts', 'Boosts/Buys', 'Which boosters to use each day, and what to buy'],
  ['/projections', 'Projections', 'Projected rax for the rest of the regular season'],
  ['/tags', 'Tag finder', 'Every game that earned a performance tag'],
  ['/otd', 'OTD optimization', 'On-this-day claims and upgrades', 'admin'],
  ['/admin', 'Admin', 'Users, reports, traffic and sponsors', 'admin']
];
// A colour for each page's box.
// Each page's own colour (2026-11-09: brighter, and themed - swaps the two-way cyan, boosts fire, packs Legendary purple, projections growth green).
const LOOK = { '/board': '#ffb020', '/board#gamedata': '#3b9eff', '/packs': '#b06bff', '/market': '#14d6b0', '/swaps': '#22d3ee', '/boosts': '#ff5a36',
  '/projections': '#34d67a', '/tags': '#ff4fb0', '/otd': '#ffd60a', '/admin': '#c3cbdb' };
// Pages behind access only show to those who have it (Dennis opened Home to everyone, 2026-11-09).
let ACC = {};
const canOpen = p => !p[3] || ACC.admin || (p[3] === 'market' && ACC.access) || (p[3] === 'pack' && ACC.pack);

// The tiles' order: moved with the arrows, kept in this browser.
const ORDER = 'rb_home_order_v1';
function tileList(){
  const list = PAGES.filter(p => p[0] !== '/' && canOpen(p));
  let o = []; try{ o = JSON.parse(ls.get(ORDER) || '[]') || []; }catch(e){}
  o = o.map(h => h === '/' ? '/board' : h === '/#gamedata' ? '/board#gamedata' : h);   // saved before the board moved to /board
  const pos = h => { const i = o.indexOf(h); return i < 0 ? 1e3 + list.findIndex(p => p[0] === h) : i; };
  return list.slice().sort((a, b) => pos(a[0]) - pos(b[0]));
}
function drawNav(){
  const list = tileList();
  $('#tiles').innerHTML = list.map(([h, t, d]) => { const c = LOOK[h] || '#E8A33D';
    return `<div class="tile" data-h="${h}"><a class="tl" href="${h}"><b>${esc(t)}</b><span>${esc(d)}</span></a>`
    + `<span class="grip" aria-label="Drag to move ${esc(t)}" title="Drag to move"><i></i></span></div>`; }).join('');
}
/* Dragging by the grip lines (mouse or finger): the box follows the pointer,
   the others slide past it, and the new order is kept on release. */
let drag = null;
$('#tiles').addEventListener('pointerdown', e => {
  const g = e.target.closest('.grip'); if(!g) return;
  e.preventDefault();
  const el = g.closest('.tile'), box = $('#tiles');
  drag = { el, id: e.pointerId, y0: e.clientY + window.scrollY, top0: el.getBoundingClientRect().top + window.scrollY, t: 0 };
  el.classList.add('drag'); box.classList.add('dragging'); document.body.classList.add('dragging');
  try{ g.setPointerCapture(e.pointerId); }catch(e2){}
});
$('#tiles').addEventListener('pointermove', e => {
  if(!drag || e.pointerId !== drag.id) return;
  e.preventDefault();
  const box = $('#tiles'), el = drag.el;
  // Swap with a neighbour once the pointer passes its middle.
  const sibs = [...box.children].filter(x => x !== el);
  const before = sibs.find(x => { const r = x.getBoundingClientRect(); return e.clientY < r.top + r.height / 2; });
  if(before ? el.nextElementSibling !== before : box.lastElementChild !== el) box.insertBefore(el, before || null);
  // Keep the box under the finger: where it should be, less where the list puts it.
  const want = drag.top0 + (e.clientY + window.scrollY - drag.y0), at = el.getBoundingClientRect().top + window.scrollY - drag.t;
  drag.t = want - at; el.style.transform = `translateY(${drag.t}px)`;
  // Near the top or bottom of the screen: scroll along.
  if(e.clientY < 60) window.scrollBy(0, -12); else if(e.clientY > window.innerHeight - 60) window.scrollBy(0, 12);
});
function endDrag(e){
  if(!drag || (e && e.pointerId !== drag.id)) return;
  const el = drag.el; drag = null;
  el.style.transform = ''; el.classList.remove('drag');
  $('#tiles').classList.remove('dragging'); document.body.classList.remove('dragging');
  ls.set(ORDER, JSON.stringify([...$('#tiles').children].map(x => x.dataset.h)));
}
$('#tiles').addEventListener('pointerup', endDrag);
$('#tiles').addEventListener('pointercancel', endDrag);
function drawAcctMenu(){
  const d = loadDevice(), cur = d && d.key;
  let a = loadAccts();
  if(cur && !a.some(x => x.key === cur)) a = [{ key: cur, name: d.name || cur, token: getToken() }, ...a];
  $('#acctmenu').innerHTML = a.map(x => x.key === cur
      ? `<button class="me" disabled><span>${esc(x.name)}</span><span class="tag">active</span></button>`
      : `<button data-use="${esc(x.key)}"><span>${esc(x.name)}</span><span class="tag">switch</span></button>`).join('')
    + '<div class="sep"></div><button class="add" data-add="1">+ Add new account</button>';
}
function openMenu(btn, menu, align){
  const open = menu.classList.contains('hide');
  closeMenus();
  if(!open) return;
  menu.classList.remove('hide'); btn.setAttribute('aria-expanded', 'true');
  const r = btn.getBoundingClientRect();
  menu.style.top = Math.round(window.scrollY + r.bottom + 8) + 'px';
  const left = align === 'center' ? r.left + r.width / 2 - menu.offsetWidth / 2 : r.left;
  menu.style.left = Math.round(Math.max(12, Math.min(left, window.innerWidth - menu.offsetWidth - 12))) + 'px';
}
function closeMenus(){ $('#acctmenu').classList.add('hide'); $('#acctbtn').setAttribute('aria-expanded', 'false'); }
$('#acctbtn').addEventListener('click', e => { e.stopPropagation(); drawAcctMenu(); openMenu($('#acctbtn'), $('#acctmenu'), 'center'); });
document.addEventListener('click', e => { if(!e.target.closest('.menu')) closeMenus(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeMenus(); });
window.addEventListener('resize', closeMenus);

// Switching: the saved token becomes the live one, then the page reloads as that account.
function keepCurrent(){ const d = loadDevice(), t = getToken(); if(!d || !d.key || !t) return; const a = loadAccts().filter(x => x.key !== d.key); a.unshift({ key: d.key, name: d.name || d.key, token: t }); saveAccts(a); }
$('#acctmenu').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b || b.disabled) return;
  if(b.dataset.use){ const x = loadAccts().find(a => a.key === b.dataset.use); if(!x) return; keepCurrent();
    ls.set(TOKEN, x.token); ls.set(DEVICE, JSON.stringify({ key: x.key, name: x.name, ts: Date.now() })); ls.set(SESSION, x.key); location.reload(); }
  else if(b.dataset.add){
    // This account stays saved; the board's sign-in shows for the new one.
    keepCurrent(); ls.set(TOKEN, null); ls.set(DEVICE, null); ls.set(SESSION, null);
    try{ sessionStorage.setItem('rb_addacct', '1'); }catch(e){}
    location.href = '/board'; }
});
$('#signout').addEventListener('click', async () => {
  if(getToken()) await api('/api/kv', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ op: 'signout' }) });
  const d = loadDevice(); if(d && d.key) saveAccts(loadAccts().filter(x => x.key !== d.key));
  ls.set(TOKEN, null); ls.set(DEVICE, null); ls.set(SESSION, null);
  location.href = '/board';
});

// The same sign-in as the board: the password is hashed here the same way, the server checks it.
async function hsHash(p){ const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('rb1:' + p)); return 's:' + [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
$('#hsign').addEventListener('submit', async e => {
  e.preventDefault();
  const u = $('#hs-u').value.trim(), p = $('#hs-p').value, msg = t => { $('#hs-msg').textContent = t; };
  if(u.length < 2) return msg('Enter your username.');
  if(p.length < 4) return msg('Password needs at least 4 characters.');
  $('#hs-go').disabled = true; msg('Signing in…');
  let d = null;
  try{ const r = await fetch('/api/kv', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ op: 'auth', key: u.toLowerCase(), name: u, hash: await hsHash(p) }) });
    d = await r.json().catch(() => null); if(!r.ok || !d || !d.ok){ $('#hs-go').disabled = false; return msg((d && d.error) || 'Could not sign in. Try again.'); } }
  catch(err){ $('#hs-go').disabled = false; return msg('Could not reach the site. Try again in a moment.'); }
  const key = u.toLowerCase(), name = d.name || u;
  ls.set(TOKEN, d.token); ls.set(DEVICE, JSON.stringify({ key, name, ts: Date.now() })); ls.set(SESSION, key);
  saveAccts([{ key, name, token: d.token }].concat(loadAccts().filter(x => x.key !== key)));
  location.reload();
});

(async () => {
  const signIn = 'Sign in on <a href="/board">the board</a> first.';
  const showSign = () => { $('#lockmsg').hidden = true; $('#hsign').hidden = false; setTimeout(() => $('#hs-u').focus(), 50); };
  if(!getToken()){ showSign(); return; }
  let j = await api('/api/rax?market=me');
  for(let i = 0; i < 2 && !j.signedIn && !j.error; i++){ await new Promise(r => setTimeout(r, 1000 * (i + 1))); j = await api('/api/rax?market=me'); }
  if(!j.signedIn){ if(j.error && !/sign in/i.test(j.error)) $('#lockmsg').innerHTML = esc(j.error); else showSign(); return; }
  ACC = j;
  const d = loadDevice();
  $('#me').textContent = (d && (d.name || d.key)) || '';
  drawNav();
  $('#lock').classList.add('hide'); $('#page').classList.remove('hide');
})();
</script>
<script src="/sponsor.js" data-page="home" defer></script>
</body>
</html>
