<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bulk ratings - Rax Academy</title>
<meta name="robots" content="noindex">
<style>
  :root{--bg:#141925;--panel:#1d2433;--panel2:#262f42;--line:#2c3549;--ink:#e9e7e1;--mute:#9aa3b5;--accent:#E8A33D;--good:#3fbf7f;--bad:#e5534b}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  .wrap{max-width:980px;margin:0 auto;padding:18px 16px 40px}
  a{color:var(--accent)}
  h1{font-size:24px;margin:8px 0 2px}
  .note{color:var(--mute);font-size:13px}
  .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--mute);margin:10px 0}
  .stat b{color:var(--ink)} .err{color:var(--bad)}
  .seg{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:14px 0 0;padding:4px;background:var(--panel);border:1px solid var(--line);border-radius:11px}
  .seg button{padding:8px 2px!important;font-size:13.5px!important;white-space:nowrap;background:none;color:var(--mute);border:1px solid transparent;border-radius:8px;padding:8px 12px;font:inherit;font-weight:700;cursor:pointer}
  .seg button[aria-pressed="true"]{color:#141925;background:var(--accent);border-color:var(--accent)}
  .bar{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
  .bar input,.bar select{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;font-size:14px}
  .bar input[type=search]{flex:1;min-width:150px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .row{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:13px 16px;border-top:1px solid var(--line)} .card > .row:first-child,.card > .grp:first-child{border-top:0}
  .grp{border-top:1px solid var(--line)} .grp > .row{border-top:0;cursor:pointer} .grp .kids{display:none;padding:0 16px 12px} .grp.open .kids{display:block}
  .nm{font-weight:800;font-size:16px} .nm a{color:var(--ink);text-decoration:none}
  .sub{color:var(--mute);font-size:12.5px}
  .rar{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--panel2);color:var(--mute);margin-left:8px;vertical-align:2px}
  .rar.r-rare{background:#E8A33D;color:#1a1206} .rar.r-epic{background:#e5534b;color:#fff} .rar.r-legendary{background:#8b5cf6;color:#fff}
  .rar.r-mystic{background:linear-gradient(135deg,#ffe58a,#d4a017);color:#2a1a00} .rar.r-iconic{background:#ec4899;color:#fff}
  .open{display:inline-block;margin-top:4px;font-size:12.5px;font-weight:700;text-decoration:none;border:1px solid var(--line);border-radius:7px;padding:3px 9px;color:var(--accent)}
  .kids .lk{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px dashed var(--line);font-size:13.5px}
  .kids .lk,.kids .lk *{text-decoration:none;color:var(--ink)} .kids .lk .note{color:var(--mute)} .kids .lk .tag{color:var(--accent)}
  .kids .lk b{min-width:64px} .kids .lk .note{font-size:12.5px} .kids .lk.dim{opacity:.6}
  .tag{font-size:11px;font-weight:800;color:var(--mute);text-transform:uppercase;letter-spacing:.03em}
  .px{text-align:right;font-weight:800;font-size:16px;white-space:nowrap} .px small{display:block;font-weight:600;font-size:11.5px;color:var(--mute)}
  .grp .px{font-size:15px} .pos{color:var(--good)} .neg{color:var(--bad)}
  .x{background:none;border:0;color:var(--mute);font-size:18px;cursor:pointer;padding:0 4px;margin-left:6px}
  .more{display:block;margin:12px auto;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 16px;font:inherit;cursor:pointer} .more[hidden]{display:none}
  .subseg{display:flex;gap:6px;margin:4px 0 8px} .subseg button{background:var(--panel2);color:var(--mute);border:1px solid var(--line);border-radius:7px;padding:5px 10px;font:inherit;font-size:13px;font-weight:700;cursor:pointer} .subseg button[aria-pressed="true"]{color:var(--ink);border-color:var(--accent)}
  .sc{overflow-x:auto} .ctab{width:100%;min-width:340px;border-collapse:collapse;font-size:13px} .ctab th{color:var(--mute);font-size:11px;text-transform:uppercase;text-align:right;padding:5px 4px;border-bottom:1px solid var(--line)} .ctab td{text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)} .ctab th:first-child,.ctab td:first-child{text-align:left}
  .empty{padding:14px;color:var(--mute);font-size:14px}
</style>
</head>
<body><div class="wrap">
<div class="top"><a href="/" style="text-decoration:none;color:var(--ink);font-weight:900;font-size:20px">Rax Academy</a><a href="/admin">Admin</a></div>
<h1>Bulk ratings</h1>
<p class="note" id="msg">Loading…</p>
<div class="stat" id="stat" hidden></div>
<div class="seg" id="seg" hidden>
  <button data-v="deals" aria-pressed="true">Deals</button>
  <button data-v="history" aria-pressed="false">History</button>
  <button data-v="grind" aria-pressed="false">Grind</button>
  <button data-v="mine" aria-pressed="false">My passes</button>
  <button data-v="live" aria-pressed="false">Live</button>
</div>
<p class="note" id="how" style="margin:10px 0 0"></p>
<div class="bar" id="bar" hidden>
  <input type="search" id="q" placeholder="Search player" autocomplete="off">
  <select id="sp"><option value="">All sports</option></select>
  <select id="per"><option value="1">Past 24 hours</option><option value="7" selected>Past week</option><option value="30">Past 30 days</option><option value="c">Custom…</option></select>
  <input type="date" id="from" hidden><input type="date" id="to" hidden>
</div>
<div class="bar" id="bar2" hidden></div>
<div class="card" id="list" hidden></div>
<button class="more" id="more" hidden>Show more</button>
</div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ls = { get: k => { try{ return localStorage.getItem(k); }catch(e){ return null; } }, set: (k, v) => { try{ localStorage.setItem(k, v); }catch(e){} } };
const ago = ms => { const m = Math.round((Date.now() - ms) / 60000); return m < 1 ? 'just now' : m < 60 ? m + ' min ago' : m < 2880 ? Math.round(m / 60) + 'h ago' : Math.round(m / 1440) + 'd ago'; };
const left = ms => { const m = Math.round((ms - Date.now()) / 60000); return m < 60 ? m + ' min' : m < 1440 ? Math.floor(m / 60) + 'h ' + (m % 60) + 'm' : Math.floor(m / 1440) + 'd ' + Math.floor(m % 1440 / 60) + 'h'; };
const fmt = v => v == null ? '-' : Math.round(v).toLocaleString();
const r100 = v => v == null ? '-' : (Math.round(v / 100) * 100).toLocaleString();   // values in clean hundreds (Dennis, 2026-11-15)
const rarCls = t => { const m = String(t || '').toLowerCase().match(/rare|epic|legendary|mystic|iconic/); return m ? ' r-' + m[0] : ''; };
const day = ms => new Date(ms).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
const kOf = r => `${r.sport}:${r.season}:${r.playerId}`;
const med = a => { if(!a.length) return null; const s = a.slice().sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
const pct = (a, p) => { if(!a.length) return null; const s = a.slice().sort((x, y) => x - y); return s[Math.min(s.length - 1, Math.floor(s.length * p))]; };
const nowPrice = r => r.buyNow ?? r.curBid ?? r.minBid;
const SOLD = r => r.price != null && /sold|buy now|last seen bid/.test(r.how || '');
const MIN_SALES = 5;   // sales of the same player and season before a value is shown
let D = null, view = ls.get('bulk_view') || 'deals', shown = 150;
const hidden = new Set(JSON.parse(ls.get('bulk_hidden') || '[]'));

// The chosen stretch of time for history-based numbers.
function span(){
  const p = $('#per').value;
  if(p === 'c'){ const f = Date.parse($('#from').value), t = Date.parse($('#to').value); return [Number.isFinite(f) ? f : 0, Number.isFinite(t) ? t + 86400000 : Date.now()]; }
  return [Date.now() - Number(p) * 86400000, Date.now()];
}
// Sales per player-season (and per sport+season+rarity, as a fallback), in the chosen stretch.
function salesBook(){
  const [a, b] = span(), by = new Map(), byRar = new Map();
  for (const r of D.ended) { if(r.endsAt < a || r.endsAt > b) continue;
    const k = kOf(r), o = by.get(k) || by.set(k, { k, name: r.name, rarity: r.rarity, sp: r.sp, sport: r.sport, season: r.season, url: r.url, sold: [], ended: 0 }).get(k); o.ended++;
    if(SOLD(r)){ o.sold.push(r); if(r.rating){ const rk = `${r.sport}:${r.season}:${r.rarity}`; (byRar.get(rk) || byRar.set(rk, []).get(rk)).push(r.price / r.rating); } } }
  /* Odd sales left out of the numbers (Dennis, 2026-11-15): once a player-season has 5+ sales,
     one at under half or over double the usual rax per rating is ignored (still listed, marked). */
  for (const o of by.values()){ const r0 = o.sold.filter(x => x.rating).map(x => x.price / x.rating), m0 = med(r0);
    if(r0.length >= 5 && m0) for (const x of o.sold) if(x.rating){ const v = x.price / x.rating; x.odd = v > 2 * m0 || v < 0.5 * m0; }
    o.odd = o.sold.filter(x => x.odd).length; o.clean = o.sold.filter(x => !x.odd); }
  for (const o of by.values()){ const pr = o.clean.filter(x => x.rating).map(x => x.price / x.rating); o.ppr = med(pr); o.pprLo = pct(pr, .25); o.avg = o.clean.length ? o.clean.reduce((t, x) => t + x.price, 0) / o.clean.length : null; o.rpr = pr.length ? pr.reduce((t, v) => t + v, 0) / pr.length : null; }
  return { by, byRar };
}
// What a pass of this player-season and rating should go for, and how sure.
function worth(book, r, loose){
  const o = book.by.get(kOf(r));
  if(o && o.sold.length >= MIN_SALES && o.ppr && r.rating) return { v: o.ppr * r.rating, lo: o.pprLo * r.rating, n: o.sold.length, basis: 'this player' };
  if(!loose) return null;
  const rr = book.byRar.get(`${r.sport}:${r.season}:${r.rarity || r.label}`);
  if(rr && rr.length >= 8 && r.rating) return { v: med(rr) * r.rating, lo: pct(rr, .25) * r.rating, n: rr.length, basis: 'same rarity' };
  return null;
}
async function load(){
  let j;
  try{ const t = ls.get('ratebrd_token_v1') || ''; j = await (await fetch('/api/swaps?op=bulklist', { headers: t ? { 'x-rb-token': t } : {} })).json(); }
  catch(e){ j = { error: 'Could not reach the site - try again.' }; }
  if(j.error){ $('#msg').innerHTML = /sign in/i.test(j.error) ? 'Sign in first - <a href="/?next=/bulk">go to sign in</a>.' : esc(j.error); return; }
  D = j; const s = j.state || {};
  $('#msg').textContent = 'Only you can see this page. Read gently on account 2: one full scan, then every 5 minutes only listings ending soon and new ones.';
  $('#stat').hidden = false;
  $('#stat').innerHTML = `<b>${j.rows.length.toLocaleString()}</b> live` + (s.count ? ` of <b>${Number(s.count).toLocaleString()}</b> on Real` : '') + ` · <b>${j.ended.length.toLocaleString()}</b> ended in history (${j.ended.filter(SOLD).length.toLocaleString()} sold)`
    + (s.fullDone ? ` · checking every 5 min${s.lastAt ? `, last ${ago(s.lastAt)}` : ''}` : ' · first full scan still going')
    + (s.exact === true ? ' · final prices from Real' : s.exact === false ? ' · final prices = last bid seen' : '')
    + (s.err ? ` · <span class="err">${esc(s.err)}${s.pauseUntil && s.pauseUntil > Date.now() ? ` - paused until ${new Date(s.pauseUntil).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}` : ''}</span>` : '');
  const sps = [...new Set(j.rows.concat(j.ended, j.mine).map(r => r.sp).filter(Boolean))].sort();
  $('#sp').innerHTML = '<option value="">All sports</option>' + sps.map(x => `<option>${esc(x)}</option>`).join(''); $('#sp').value = ls.get('bulk_sp') || '';
  $('#per').value = ls.get('bulk_per') || '7'; $('#from').value = ls.get('bulk_from') || ''; $('#to').value = ls.get('bulk_to') || '';
  $('#seg').hidden = false; $('#bar').hidden = false; $('#list').hidden = false; setView(view);
}
function setView(v){ view = v; ls.set('bulk_view', v); shown = 150;
  document.querySelectorAll('#seg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === v));
  const custom = $('#per').value === 'c'; $('#from').hidden = $('#to').hidden = !custom;
  draw(); }
const pass = r => { const q = $('#q').value.trim().toLowerCase(), sp = $('#sp').value; return (!q || String(r.name || '').toLowerCase().includes(q)) && (!sp || r.sp === sp); };
const openA = r => r.link ? `<a class="open" href="${esc(r.link)}" target="_blank" rel="noopener">Open auction ↗</a>` : '';
const lkRow = x => `<a class="lk${SOLD(x) && !x.odd ? '' : ' dim'}" href="${esc(x.link)}" target="_blank" rel="noopener"><b>${SOLD(x) ? fmt(x.price) : x.endsAt > Date.now() ? fmt(nowPrice(x)) : '-'}</b><span class="note">${x.endsAt > Date.now() ? 'live · ends in ' + left(x.endsAt) : esc(x.how || '') + ' · ' + day(x.endsAt)} · rating ${fmt(x.rating)}</span><span class="tag">${x.odd ? 'ignored · ' : ''}Open ↗</span></a>`;
const nameCell = (r, extra = '') => `<span class="nm">${r.url ? `<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.name || 'Player ' + r.playerId)}</a>` : esc(r.name || 'Player ' + r.playerId)}</span>${r.rarity || r.label ? `<span class="rar${rarCls(r.rarity || r.label)}">${esc(r.rarity || r.label)}</span>` : ''}${extra}`;
function out(html, n, help){ $('#how').textContent = help; $('#how').hidden = !help; $('#list').innerHTML = html || '<div class="empty">Nothing here yet.</div>'; $('#more').hidden = n <= shown; }
// Seasons the way Real shows them (Dennis, 2026-11-15): 2025-26, or one year where a season sits in one year.
const seasonLbl = (sp, se) => { se = Number(se); if(!se) return ''; if(['mlb', 'golf', 'wnba'].includes(sp)) return String(se);
  return ['nba', 'ncaam'].includes(sp) ? `${se - 1}-${String(se).slice(2)}` : `${se}-${String(se + 1).slice(2)}`; };
const plainName = r => `<span class="nm">${r.url ? `<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.name || 'Player ' + r.playerId)}</a>` : esc(r.name || 'Player ' + r.playerId)}</span>`;
// The rating where each rarity starts: Rare and Epic from the listings seen, the rest from Real's ladder.
function rarThresholds(){
  const lo = lab => { const v = D.rows.concat(D.ended).filter(r => r.rarity === lab && r.rating).map(r => r.rating).sort((a, b) => a - b); return v.length >= 10 ? v[Math.floor(v.length * 0.02)] : null; };
  return [['Rare', lo('Rare') || 50], ['Epic', lo('Epic') || 150], ['Legendary', 380], ['Mystic', 1380]].map(([name, at]) => ({ name, at: Math.round(at) }));
}
// How he gets the packs: buy them himself, through swaps, or 160 back - and what a pack costs that way (editable).
const GRIND_WAYS = { self: ['Pack yourself', 200], swap: ['Swaps', 241], b160: ['160 back', 271], full: ['Full price', 420] };   // Dennis, 2026-11-15
function grindSetup(){
  const way = GRIND_WAYS[ls.get('bulk_gway')] ? ls.get('bulk_gway') : 'self', cost = GRIND_WAYS[way][1];
  $('#bar2').hidden = false;
  $('#bar2').innerHTML = `<select id="gway">${Object.entries(GRIND_WAYS).map(([k, v]) => `<option value="${k}">${v[0]} - ${v[1]} rax a pack</option>`).join('')}</select>`;
  $('#gway').value = way;
  return { way, cost, label: GRIND_WAYS[way][0].toLowerCase() };
}
// Not on Grind (Dennis, 2026-11-15): UFC, FC, and the 2026-27 NBA and CBB seasons for now.
const GRIND_SKIP = o => ['ufc', 'soccer'].includes(o.sport) || (['nba', 'ncaam'].includes(o.sport) && Number(o.season) >= 2027);
function grindRow(o, g, rarT){
  const pi = D.plays[o.k], plays = Array.isArray(pi) ? pi[0] : pi ?? null, avgCard = Array.isArray(pi) ? pi[1] : null, pack = avgCard ? avgCard * 3 : null;
  const rars = rarT.map(r => { const sell = o.rpr * r.at, packs = pack ? Math.ceil(r.at / pack) : null, cost = packs != null ? packs * g.cost : null;
    return { ...r, sell, packs, cost, profit: cost != null ? sell - cost : null }; });
  const best = rars.filter(r => r.profit != null && r.name !== 'Mystic').sort((a, b) => b.profit - a.profit)[0] || null;
  return { o, plays, pack, rars, best };
}
const costTable = (x, g) => !x.pack ? '<p class="note">No pack data for this player, so the cost can\'t be worked out.</p>'
  : `<table class="ctab"><tr><th>Rarity</th><th>Rating</th><th>Packs</th><th>Cost</th><th>Sells for</th><th>Profit</th></tr>${x.rars.map(r => `<tr><td>${esc(r.name)}</td><td>${r.at.toLocaleString()}</td><td>${r.packs}</td><td>${r100(r.cost)}</td><td>${r100(r.sell)}</td><td class="${r.profit > 0 ? 'pos' : 'neg'}">${r.profit > 0 ? '+' : ''}${r100(r.profit)}</td></tr>`).join('')}</table>
    <p class="note">${esc(GRIND_WAYS[g.way][0])} at ${g.cost} rax a pack. Avg pack = 3 cards × his average card rating (${(x.pack / 3).toFixed(1)}).</p>`;
function draw(){
  if(!D) return;
  $('#bar2').hidden = true; $('#bar2').innerHTML = '';
  const book = salesBook(), perTxt = $('#per').selectedOptions[0].text.replace(/^Past /, '').toLowerCase();
  if(view === 'deals'){
    // 1. Only on solid data: 5+ sales of that exact player and season, buy-now listings or bids under the usual price.
    const l = D.rows.filter(pass).map(r => { const w = worth(book, r), p = nowPrice(r); return w && p != null ? { r, w, p, gain: w.v - p } : null; }).filter(x => x && x.gain >= 100).sort((a, b) => b.gain - a.gain);
    const ready = [...book.by.values()].filter(o => o.sold.length >= MIN_SALES).length;
    if(!l.length) return out(`<div class="empty">No deals yet. Deals only show for a player and season with ${MIN_SALES}+ sales in the ${perTxt} - ${ready} so far. This fills in as auctions end.</div>`, 0, '');
    return out(l.slice(0, shown).map(({ r, w, p, gain }) => `<div class="row"><div>${nameCell(r)}<div class="sub">${esc(r.sp)} ${esc(r.season)} · rating ${fmt(r.rating)} · ends in ${left(r.endsAt)}${r.bids ? ` · ${r.bids} bids` : ''}</div>
      <div class="sub">Usually sells for ${r100(w.v)} (${w.n} sales)</div>${openA(r)}</div>
      <div class="px pos">+${r100(gain)}<small>${r.buyNow != null ? 'buy now' : r.curBid != null ? 'bid' : 'min bid'} ${fmt(p)}</small></div></div>`).join(''), l.length,
      `Under what that pass usually sells for, from ${MIN_SALES}+ sales in the ${perTxt}. Buy now is exact; bids can still rise.`);
  }
  if(view === 'history'){
    // 2. Per player and season: sold/ended and average rax per rating point. Tap for every auction with its link.
    const hs = ls.get('bulk_hsort') || 'sold';
    $('#bar2').hidden = false; $('#bar2').innerHTML = `<select id="hsort"><option value="sold">Sort: most sold</option><option value="rpr">Sort: rax per rating</option></select>`; $('#hsort').value = hs;
    const l = [...book.by.values()].filter(o => o.ended && pass(o)).sort(hs === 'rpr' ? (a, b) => (b.rpr ?? -1) - (a.rpr ?? -1) : (a, b) => b.sold.length - a.sold.length || b.ended - a.ended);
    return out(l.slice(0, shown).map(o => { const all = D.ended.filter(x => kOf(x) === o.k && inSpan(x) && SOLD(x)).sort((a, b) => b.endsAt - a.endsAt);
      return `<div class="grp"><div class="row"><div>${plainName(o)}<div class="sub">${esc(o.sp)} ${esc(seasonLbl(o.sport, o.season))} · ${o.sold.length}/${o.ended} sold${o.rpr != null ? ` · avg ${o.rpr.toFixed(2)}/1` : ''}</div></div><div class="px">${o.sold.length}<small>sold ▾</small></div></div>
      <div class="kids">${all.map(lkRow).join('')}</div></div>`; }).join(''), l.length,
      'Every ended auction. Avg = rax per rating point (400 rax for an 86 rating = 4.65/1). Tap a player for each auction.');
  }
  if(view === 'grind'){
    // 3. What a pass sells for at each rarity against what the packs cost to get there.
    const g = grindSetup(), rarT = rarThresholds();
    const l = [...book.by.values()].filter(o => o.sold.length && o.rpr && pass(o) && !GRIND_SKIP(o)).map(o => grindRow(o, g, rarT)).sort((a, b) => (b.best ? b.best.profit : -1e9) - (a.best ? a.best.profit : -1e9));
    return out(l.slice(0, Math.max(shown, 100)).map(x => { const o = x.o, all = D.rows.filter(y => kOf(y) === o.k).sort((a, b) => a.endsAt - b.endsAt).concat(D.ended.filter(y => kOf(y) === o.k && inSpan(y) && SOLD(y)).sort((a, b) => b.endsAt - a.endsAt));
      return `<div class="grp"><div class="row"><div>${plainName(o)}
        <div class="sub">${esc(o.sp)} ${esc(seasonLbl(o.sport, o.season))} | sells ${o.sold.length}/${o.ended} (${Math.round(o.sold.length / o.ended * 100)}%) | ${o.rpr.toFixed(2)}/1</div>
        <div class="sub">${x.plays != null ? x.plays + ' plays' : 'no pack data'}${x.pack ? ` | avg pack ${x.pack.toFixed(1)}` : ''} | ${x.rars.map(r => `${r.name} = ${r100(r.sell)}`).join(' | ')}</div></div>
        <div class="px ${x.best && x.best.profit > 0 ? 'pos' : 'neg'}">${x.best ? (x.best.profit > 0 ? '+' : '') + r100(x.best.profit) : '-'}<small>${x.best ? 'at ' + x.best.name + ' ▾' : 'no pack data ▾'}</small></div></div>
        <div class="kids"><div class="subseg"><button data-sub="a" aria-pressed="true">Auctions</button><button data-sub="c" aria-pressed="false">Cost &amp; profit</button></div>
        <div class="sa">${all.map(lkRow).join('') || '<p class="note">None.</p>'}</div>
        <div class="sc" hidden>${costTable(x, g)}</div></div></div>`; }).join(''), l.length,
      `Sorted by profit at the best of Rare, Epic and Legendary: what the pass sells for (its rax per rating × the rarity's rating) minus the packs to get there (pack = 3 cards; ${g.label}, ${g.cost} rax a pack).`);
  }
  if(view === 'mine'){
    // 4. His passes in clean hundreds; ✕ hides one on this phone.
    const l = D.mine.filter(r => !hidden.has(r.key) && pass(r) && /rare|epic|legendary|mystic|iconic/i.test(r.label || '')).map(r => ({ r, w: worth(book, { ...r, rarity: r.label }, true) })).sort((a, b) => (b.w ? b.w.v : -1) - (a.w ? a.w.v : -1));
    return out(l.slice(0, shown).map(({ r, w }) => `<div class="row"><div>${nameCell(r, `<button class="x" data-hide="${esc(r.key)}" title="Hide">✕</button>`)}<div class="sub">${esc(r.sp)} ${esc(r.season)} · rating ${fmt(r.rating)}${r.url ? ` · <a href="${esc(r.url)}" target="_blank" rel="noopener">your pass</a>` : ''}</div>
      <div class="sub">${w ? `List at <b>${r100(w.v)}</b> · quick sale ${r100(w.lo)} · ${w.n} sales${w.basis === 'same rarity' ? ' (same rarity)' : ''}` : 'Not enough sales yet'}</div></div>
      <div class="px">${w ? r100(w.v) : '-'}<small>worth</small></div></div>`).join('') + (hidden.size ? `<div class="row"><span class="note">${hidden.size} hidden · <a href="#" id="unhide">show them again</a></span></div>` : ''), l.length,
      'Priced from sales of the same player and season. Search to find one, ✕ to hide.');
  }
  // All live listings, ending soonest.
  const l = D.rows.filter(pass).sort((a, b) => a.endsAt - b.endsAt);
  out(l.slice(0, shown).map(r => `<div class="row"><div>${nameCell(r)}<div class="sub">${esc(r.sp)} ${esc(r.season)} · rating ${fmt(r.rating)} · ends in ${left(r.endsAt)}${r.bids ? ` · ${r.bids} bids` : ''}</div>${openA(r)}</div>
    <div class="px">${fmt(nowPrice(r))}<small>${r.buyNow != null ? 'buy now' : r.curBid != null ? 'current bid' : 'min bid'}</small></div></div>`).join(''), l.length, 'Every live listing, ending soonest.');
}
const inSpan = x => { const [a, b] = span(); return x.endsAt >= a && x.endsAt <= b; };
document.querySelectorAll('#seg button').forEach(b => b.addEventListener('click', () => setView(b.dataset.v)));
$('#q').addEventListener('input', () => { shown = 150; draw(); });
$('#sp').addEventListener('change', e => { ls.set('bulk_sp', e.target.value); shown = 150; draw(); });
$('#per').addEventListener('change', e => { ls.set('bulk_per', e.target.value); setView(view); });
for(const id of ['from', 'to']) $('#' + id).addEventListener('change', e => { ls.set('bulk_' + id, e.target.value); draw(); });
$('#more').addEventListener('click', () => { shown += 200; draw(); });
$('#bar2').addEventListener('change', e => {
  if(e.target.id === 'hsort') ls.set('bulk_hsort', e.target.value);
  if(e.target.id === 'gway') ls.set('bulk_gway', e.target.value);
  if(e.target.id === 'gcost') ls.set('bulk_gcost2_' + (ls.get('bulk_gway') || 'self'), e.target.value);
  draw(); });
$('#list').addEventListener('click', e => {
  const h = e.target.closest('[data-hide]'); if(h){ e.preventDefault(); hidden.add(h.dataset.hide); ls.set('bulk_hidden', JSON.stringify([...hidden])); draw(); return; }
  if(e.target.id === 'unhide'){ e.preventDefault(); hidden.clear(); ls.set('bulk_hidden', '[]'); draw(); return; }
  const sb = e.target.closest('[data-sub]'); if(sb){ const k = sb.closest('.kids'); k.querySelectorAll('[data-sub]').forEach(b => b.setAttribute('aria-pressed', b === sb)); k.querySelector('.sa').hidden = sb.dataset.sub !== 'a'; k.querySelector('.sc').hidden = sb.dataset.sub !== 'c'; return; }
  if(e.target.closest('a') || e.target.closest('.kids')) return;
  const g = e.target.closest('.grp'); if(g) g.classList.toggle('open');
});
load();
</script>
</body>
</html>
