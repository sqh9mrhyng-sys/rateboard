<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bulk ratings - Rax Academy</title>
<meta name="robots" content="noindex">
<style>
  :root{--bg:#141925;--panel:#1d2433;--panel2:#262f42;--line:#2c3549;--ink:#e9e7e1;--mute:#9aa3b5;--accent:#E8A33D;--good:#3fbf7f;--bad:#e5534b}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  .wrap{max-width:980px;margin:0 auto;padding:18px 16px 40px}
  a{color:var(--accent)}
  h1{font-size:24px;margin:8px 0 2px}
  .note{color:var(--mute);font-size:13px}
  .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .bar{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
  .bar input,.bar select{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;font-size:14px}
  .bar input{flex:1;min-width:150px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--mute);margin:10px 0}
  .stat b{color:var(--ink)} .stat .err{color:var(--bad)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .row{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 14px;border-top:1px solid var(--line)} .row:first-child{border-top:0}
  .nm{font-weight:800;font-size:16px} .nm a{color:var(--ink);text-decoration:none}
  .sub{color:var(--mute);font-size:12.5px}
  .rar{display:inline-block;font-size:11px;font-weight:800;padding:1px 7px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);margin-left:6px;vertical-align:2px}
  .px{text-align:right;font-weight:800;font-size:16px;white-space:nowrap} .px small{display:block;font-weight:600;font-size:11.5px;color:var(--mute)}
  .ends.soon{color:var(--bad)}
  .more{display:block;margin:12px auto;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 16px;font:inherit;cursor:pointer}
</style>
</head>
<body><div class="wrap">
<div class="top"><a href="/" style="text-decoration:none;color:var(--ink);font-weight:900;font-size:20px">Rax Academy</a><a href="/admin">Admin</a></div>
<h1>Bulk ratings</h1>
<p class="note" id="msg">Loading…</p>
<div class="stat" id="stat" hidden></div>
<div class="bar" id="bar" hidden>
  <input id="q" placeholder="Search player" autocomplete="off">
  <select id="sp"><option value="">All sports</option></select>
  <select id="rar"><option value="">All rarities</option></select>
  <select id="sort">
    <option value="ends">Ending soonest</option>
    <option value="price">Price: low to high</option>
    <option value="pricehi">Price: high to low</option>
    <option value="rating">Rating: high to low</option>
    <option value="ppr">Price per rating: best first</option>
    <option value="bids">Most bids</option>
  </select>
</div>
<div class="card" id="list" hidden></div>
<button class="more" id="more" hidden>Show more</button>
</div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ls = { get: k => { try{ return localStorage.getItem(k); }catch(e){ return null; } }, set: (k, v) => { try{ localStorage.setItem(k, v); }catch(e){} } };
const ago = ms => { const m = Math.round((Date.now() - ms) / 60000); return m < 1 ? 'just now' : m < 60 ? m + ' min ago' : Math.round(m / 60) + 'h ago'; };
const left = ms => { const m = Math.round((ms - Date.now()) / 60000); return m < 60 ? m + ' min' : m < 1440 ? Math.floor(m / 60) + 'h ' + (m % 60) + 'm' : Math.floor(m / 1440) + 'd ' + Math.floor(m % 1440 / 60) + 'h'; };
const price = r => r.buyNow ?? r.curBid ?? r.minBid;
let rows = [], shown = 100;
async function load(){
  let j;
  try{ const t = ls.get('ratebrd_token_v1') || ''; j = await (await fetch('/api/swaps?op=bulklist', { headers: t ? { 'x-rb-token': t } : {} })).json(); }
  catch(e){ j = { error: 'Could not reach the site - try again.' }; }
  if(j.error){ $('#msg').innerHTML = /sign in/i.test(j.error) ? 'Sign in first - <a href="/?next=/bulk">go to sign in</a>.' : esc(j.error); return; }
  rows = j.rows || []; const s = j.state || {};
  $('#msg').textContent = 'Every bulk rating listing on Real, read slowly on account 2 and kept up to date. Only you can see this page.';
  $('#stat').hidden = false;
  $('#stat').innerHTML = `<b>${rows.length.toLocaleString()}</b> listings here` + (s.count ? ` of <b>${Number(s.count).toLocaleString()}</b> on Real` : '')
    + (s.lastAt ? ` · last read ${ago(s.lastAt)}` : ' · not read yet - the first pass takes about 45 minutes')
    + (s.passes ? ` · full passes: ${s.passes}${s.passAt ? ` (last finished ${ago(s.passAt)})` : ''}` : ' · first pass still going')
    + (s.err ? ` · <span class="err">${esc(s.err)}${s.pauseUntil && s.pauseUntil > Date.now() ? ` - paused until ${new Date(s.pauseUntil).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}` : ''}</span>` : '');
  const opts = (sel, vals, keep) => { const v = $(sel).value; $(sel).innerHTML = $(sel).options[0].outerHTML + [...new Set(vals.filter(Boolean))].sort().map(x => `<option>${esc(x)}</option>`).join(''); $(sel).value = keep ?? v; };
  opts('#sp', rows.map(r => r.sp), ls.get('bulk_sp') || ''); opts('#rar', rows.map(r => r.rarity), ls.get('bulk_rar') || '');
  $('#sort').value = ls.get('bulk_sort') || 'ends';
  $('#bar').hidden = false; $('#list').hidden = false; draw();
}
function draw(){
  const q = $('#q').value.trim().toLowerCase(), sp = $('#sp').value, rar = $('#rar').value, so = $('#sort').value;
  let l = rows.filter(r => (!q || String(r.name).toLowerCase().includes(q)) && (!sp || r.sp === sp) && (!rar || r.rarity === rar));
  const n = v => v == null ? Infinity : Number(v);
  const f = { ends: (a, b) => a.endsAt - b.endsAt, price: (a, b) => n(price(a)) - n(price(b)), pricehi: (a, b) => (price(b) ?? -1) - (price(a) ?? -1),
    rating: (a, b) => (b.rating ?? -1) - (a.rating ?? -1), ppr: (a, b) => n(price(a) != null && a.rating ? price(a) / a.rating : null) - n(price(b) != null && b.rating ? price(b) / b.rating : null),
    bids: (a, b) => b.bids - a.bids }[so];
  l.sort(f);
  $('#list').innerHTML = l.slice(0, shown).map(r => { const p = price(r), soon = r.endsAt - Date.now() < 3600000;
    return `<div class="row"><div><span class="nm">${r.url ? `<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.name || 'Player ' + r.playerId)}</a>` : esc(r.name || 'Player ' + r.playerId)}</span>${r.rarity ? `<span class="rar">${esc(r.rarity)}</span>` : ''}
      <div class="sub">${esc(r.sp || '')} ${esc(r.season || '')}${r.rating != null ? ` · rating ${Number(r.rating).toLocaleString()}` : ''}${r.mult ? ` · ${esc(r.mult)}` : ''}${r.cards ? ` · ${r.cards} card${r.cards === 1 ? '' : 's'}` : ''}${r.serial ? ` · #${esc(r.serial)}` : ''}</div>
      <div class="sub">Ends in <span class="ends${soon ? ' soon' : ''}">${left(r.endsAt)}</span>${r.bids ? ` · ${r.bids} bid${r.bids === 1 ? '' : 's'}` : ''}</div></div>
      <div class="px">${p != null ? Number(p).toLocaleString() : '-'}<small>${r.buyNow != null ? 'buy now' : r.curBid != null ? 'current bid' : r.minBid != null ? 'min bid' : ''}${p != null && r.rating ? ` · ${(p / r.rating).toFixed(1)}/rating` : ''}</small></div></div>`; }).join('')
    || '<div class="row"><span class="note">Nothing matches.</span></div>';
  $('#more').hidden = l.length <= shown;
}
$('#q').addEventListener('input', () => { shown = 100; draw(); });
for(const [id, k] of [['#sp', 'bulk_sp'], ['#rar', 'bulk_rar'], ['#sort', 'bulk_sort']]) $(id).addEventListener('change', e => { ls.set(k, e.target.value); shown = 100; draw(); });
$('#more').addEventListener('click', () => { shown += 200; draw(); });
load();
</script>
</body>
</html>
